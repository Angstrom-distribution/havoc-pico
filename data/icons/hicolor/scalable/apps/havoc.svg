<?xml version="1.0" encoding="UTF-8"?>
<!-- havoc icon: a terminal window with a blue prompt chevron and a cursor.
     Straight edges sit on multiples of 4 units, so they land on whole
     pixels at 16, 32, 48, 64 and 128 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <polygon fill="#7d8590" points="4,8 60,8 60,56 4,56"/>
  <polygon fill="#eef0f2" points="8,12 56,12 56,20 8,20"/>
  <polygon fill="#7d8590" points="12,14 16,14 16,18 12,18"/>
  <polygon fill="#7d8590" points="20,14 24,14 24,18 20,18"/>
  <polygon fill="#7d8590" points="28,14 32,14 32,18 28,18"/>
  <polygon fill="#1f2328" points="8,20 56,20 56,52 8,52"/>
  <polygon fill="#3a7cf0" points="16,28 20,28 28,36 20,44 16,44 24,36"/>
  <polygon fill="#eef0f2" points="32,40 44,40 44,44 32,44"/>
</svg>
